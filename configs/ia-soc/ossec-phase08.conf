<!-- Phase 08 — Ajouté à /var/ossec/etc/ossec.conf sur ia-soc -->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/ia-soc/ia-alertes.json</location>
  </localfile>
  <syscheck>
    <directories realtime="yes" check_all="yes">/opt/ia-soc/models</directories>
    <directories realtime="yes" check_all="yes">/opt/ia-soc/src</directories>
    <directories realtime="yes" check_all="yes">/etc/ia-soc</directories>
    <directories realtime="yes" check_all="yes">/etc/systemd/system/ia-analyse.service</directories>
  </syscheck>
</ossec_config>
